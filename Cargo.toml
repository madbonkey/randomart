[package]
name = "randomart"
version = "0.0.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
macroquad = "0.4"
rand = "0.9"
rayon = "1.10"
sha256 = "1.5"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[lints.clippy]
len_without_is_empty = "allow"
